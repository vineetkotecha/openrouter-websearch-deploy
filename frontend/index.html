<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>divAIne Search</title><style>:root{color-scheme:dark}body{font:15px Inter,system-ui;margin:0;background:#080d1b;color:#eef2ff}main{max-width:1160px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center}.card{background:#121a30;border:1px solid #273252;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}input,textarea,button,select{font:inherit;padding:11px;border-radius:9px;border:1px solid #495372;box-sizing:border-box}input,textarea,select{width:100%;background:#080d1b;color:white;margin:5px 0}button{background:#665cf6;color:white;cursor:pointer;margin:6px 5px 0 0}.muted{color:#aab4d0}.results{display:grid;gap:12px}.result{border:1px solid #344163;border-radius:12px;padding:15px}.meta{font-size:12px;color:#9aa8c7}.trace{white-space:pre-wrap;background:#070b14;padding:14px;border-radius:10px;overflow:auto;max-height:420px}a{color:#91b4ff}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><div><h1>divAIne Search</h1><p class="muted">Search, citations, history, usage and hosted MCP.</p></div><button onclick="logout()">Clear local access</button></header><div class="grid"><section class="card"><h2>Create account</h2><input id="email" placeholder="Email"><input id="name" placeholder="Display name"><input id="password" type="password" placeholder="Password (10+ characters)"><button onclick="signup()">Sign up</button><button onclick="login()">Log in</button><pre id="authOut" class="trace">API keys are shown once. Store yours securely.</pre></section><section class="card"><h2>Access & MCP</h2><input id="key" type="password" placeholder="API key or session token"><input id="tenant" placeholder="Tenant ID"><p><code>https://mcp.divaine.io/mcp</code></p><button onclick="usage()">Usage & cost</button><button onclick="history()">History</button><button onclick="exportCsv()">Export CSV</button></section></div><section class="card"><h2>Search</h2><textarea id="query" rows="3" placeholder="What do you need to find?">quiet laptop for a shared office</textarea><div><label>Provider filter <select id="provider"><option value="">Automatic</option><option>exa</option><option>serpapi</option><option>valyu</option><option>jina</option><option>firecrawl</option></select></label></div><button onclick="run()">Run search</button><div id="question"></div></section><section class="card"><h2>Sources & citations</h2><div id="results" class="results muted">No search yet.</div></section><section class="card"><h2>Trace</h2><pre id="out" class="trace">No request yet.</pre></section></main><script>const API="https://divaine-search-harness.onrender.com";
const auth=()=>({'authorization':'Bearer '+key.value});const save=()=>{localStorage.dvkey=key.value;localStorage.dvtenant=tenant.value};key.value=localStorage.dvkey||'';tenant.value=localStorage.dvtenant||'';function logout(){localStorage.clear();key.value=tenant.value=''}
async function json(url,o={}){let r=await fetch((url.startsWith('/v1/')?API:'')+url,o),j=await r.json().catch(()=>({error:'invalid_response'}));if(!r.ok)throw j;return j}
async function signup(){try{let j=await json('/v1/signup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,display_name:name.value,password:password.value})});authOut.textContent=JSON.stringify(j,null,2);key.value=j.api_key;tenant.value=j.tenant_id;save()}catch(e){authOut.textContent=JSON.stringify(e,null,2)}}
async function login(){try{let j=await json('/v1/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});authOut.textContent=JSON.stringify(j,null,2);key.value=j.session_token;tenant.value=j.tenant_id;save()}catch(e){authOut.textContent=JSON.stringify(e,null,2)}}
function render(j){out.textContent=JSON.stringify(j,null,2);if(j.status==='needs_input'){question.innerHTML='<p>'+j.question+'</p><input id="answer" placeholder="Your answer"><button onclick="resume(\''+j.resume_token+'\')">Continue</button>';return}question.innerHTML='';results.innerHTML=(j.results||[]).map(x=>'<article class="result"><h3><a target="_blank" rel="noopener" href="'+x.url+'">'+esc(x.title)+'</a></h3><p>'+esc(x.snippet)+'</p><div class="meta">#'+x.rank+' · '+esc(x.provider)+' · mandate fit '+Math.round(x.mandate_fit*100)+'% · evidence '+x.faithfulness.state+' '+Math.round(x.faithfulness.score*100)+'%</div><p>'+esc(x.reason)+'</p><button onclick="outcome(\''+j.episode_id+'\',\'selected\',\''+encodeURIComponent(x.url)+'\')">Selected</button><button onclick="outcome(\''+j.episode_id+'\',\'rejected\',\''+encodeURIComponent(x.url)+'\')">Not useful</button></article>').join('')||'<p>No results.</p>'}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){out.textContent='Running…';try{let p=provider.value;let j=await json('/v1/search',{method:'POST',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify({query:query.value,tenant_id:tenant.value,provider_allowlist:p?[p]:undefined,permissions:{may_retain:true,may_ask_user:true},limits:{max_provider_calls:3,max_results:10,latency_ms:30000}})});render(j)}catch(e){out.textContent=JSON.stringify(e,null,2)}}async function resume(t){try{render(await json('/v1/resume',{method:'POST',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify({resume_token:t,answer:answer.value})}))}catch(e){out.textContent=JSON.stringify(e,null,2)}}async function outcome(id,type,url){await json('/v1/outcomes',{method:'POST',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify({episode_id:id,event_id:crypto.randomUUID(),type,result_url:decodeURIComponent(url),occurred_at:new Date().toISOString()})})}async function usage(){out.textContent=JSON.stringify(await json('/v1/usage',{headers:auth()}),null,2)}async function history(){let j=await json('/v1/history',{headers:auth()});out.textContent=JSON.stringify(j,null,2);results.innerHTML=j.map(x=>'<article class="result"><h3>'+esc(x.query)+'</h3><div class="meta">'+x.created_at+' · '+x.duration_ms+' ms · '+x.id+'</div></article>').join('')}async function exportCsv(){let r=await fetch(API+'/v1/export',{headers:auth()}),b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='divaine-history.csv';a.click()}
</script></body></html>`
